# 生产环境配置
# 用于部署到阿里云服务器

spring:
  datasource:
    # 服务器上的MySQL地址
    url: jdbc:mysql://localhost:3306/heritage_platform?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080
  servlet:
    context-path: /api

# 公网访问地址（将 47.121.184.145 替换为你的服务器IP）
app:
  address-base-url: http://47.121.184.145:8080/api

# 区块链配置
blockchain:
  rpc-url: https://ethereum-sepolia-rpc.publicnode.com
  contract-address: "0xcf2B554b77d6E6696266BFd8b3919eD58B21991f"
  chain-id: 11155111
  gas-price: 3000000000
  gas-limit: 600000
  http-timeout-seconds: 30
  platform-private-key: "YOUR_PRIVATE_KEY_HERE"
