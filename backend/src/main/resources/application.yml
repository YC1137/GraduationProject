spring:
  application:
    name: heritage-platform
  
  datasource:
    url: jdbc:mysql://localhost:3306/heritage_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      auto-commit: true
      connection-test-query: SELECT 1
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 全局响应编码 UTF-8
  mandatory-response-character-encoding: true
  web:
    resources:
      add-mappings: true

server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# JWT 配置
jwt:
  secret: your-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long
  expiration: 86400000 # 24小时(毫秒)

# 日志配置
logging:
  level:
    com.heritage: INFO
    org.springframework.web: INFO
    org.hibernate: INFO

blockchain:
  rpc-url: https://ethereum-sepolia-rpc.publicnode.com
  contract-address: "0xcf2B554b77d6E6696266BFd8b3919eD58B21991f"
  chain-id: 11155111
  gas-price: 3000000000
  gas-limit: 600000
  http-timeout-seconds: 60
  receipt-poll-interval-ms: 1500
  receipt-poll-attempts: 80
  platform-private-key: "0xffcdecdded7b291d264d056066515363a780d3baa1e65f5643bb87bd1dee56d8"

# 公网 tokenURI 基础地址（使用 ngrok 时改为 ngrok 的 https 地址）
app:
  base-url: https://你的ngrok地址.ngrok-free.app/api
