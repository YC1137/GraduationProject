spring:
  application:
    name: heritage-platform
  
  datasource:
    url: jdbc:mysql://localhost:3306/heritage_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      auto-commit: true
      connection-test-query: SELECT 1
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

# JWT 配置
jwt:
  secret: your-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long
  expiration: 86400000 # 24小时(毫秒)

# 日志配置
logging:
  level:
    com.heritage: INFO
    org.springframework.web: INFO
    org.hibernate: INFO
